name: schema

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pglast
      - name: Parse schema, prove RLS coverage
        run: python scripts/check_schema.py
      - name: Tables documented in DATABASE_SCHEMA.md
        run: python scripts/check_docs.py
